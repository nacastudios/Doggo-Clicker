<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doggo Clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fdf6ec;
            text-align: center;
            padding-top: 50px;
            color: #333;
            overflow: hidden;
        }
        h1 {
            color: #d97706;
            margin-bottom: 5px;
        }
        .subtitle {
            font-style: italic;
            color: #78350f;
            margin-bottom: 20px;
        }
        #click-btn {
            font-size: 80px;
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            transition: transform 0.1s ease;
        }
        #click-btn:active {
            transform: scale(0.85);
        }
        .counter {
            font-size: 28px;
            font-weight: bold;
            margin-top: 20px;
            color: #b45309;
        }
        /* Secret Cutscene Overlay Styling */
        #cutscene-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }
        #cutscene-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .explosion {
            font-size: 100px;
            animation: shake 0.5s infinite;
        }
        .cutscene-text {
            font-size: 24px;
            max-width: 600px;
            line-height: 1.5;
            margin-top: 20px;
            color: #fca5a5;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            60% { transform: translate(-3px, 1px) role(0deg); }
            80% { transform: translate(1px, -1px) rotate(-1deg); }
            100% { transform: translate(1px, 2px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <h1>Doggo Clicker</h1>
    <div class="subtitle">Starring Rusty the Wiener Dog</div>
    
    <button id="click-btn" title="Click Rusty!">🐕🌭</button>
    <div class="counter">NACA COIN: <span id="score">0</span></div>

    <div id="cutscene-overlay">
        <div class="explosion">💥🧨🐕</div>
        <h2>SECRET CUTSCENE: OPERATION MINE-BLOW</h2>
        <div class="cutscene-text">
            You reached 50,000 NACA COIN! Cojnrad nods at Rusty the wiener dog. Rusty lights the fuse with a tiny paw. <br><br><strong>KABOOM!</strong> The mine goes up in smoke! Mission accomplished.
        </div>
    </div>

    <script>
        let score = 0;
        let cutsceneTriggered = false;
        
        const clickBtn = document.getElementById('click-btn');
        const scoreDisplay = document.getElementById('score');
        const cutsceneOverlay = document.getElementById('cutscene-overlay');

        clickBtn.addEventListener('click', () => {
            if (cutsceneTriggered) return;

            score++;
            scoreDisplay.textContent = score;

            // Check for the 50,000 NACA COIN Secret Cutscene
            if (score >= 50000) {
                cutsceneTriggered = true;
                cutsceneOverlay.classList.add('active');
            }
        });
    </script>

</body>
</html>
